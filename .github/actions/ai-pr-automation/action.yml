
name: AI PR Automation
description: Run the AI PR automation

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: pip install -r "${{ github.action_path }}/../../../requirements.txt"

    - name: Install test dependencies
      shell: bash
      run: pip install pytest

    - name: Run AI PR Automation
      shell: bash
      env:
        AI_PR_AUTOMATION_REPOSITORY: boAt-Lifestyle/boat-AI-PR-automation
      run: python -u "${{ github.action_path }}/../../../run_action.py"
